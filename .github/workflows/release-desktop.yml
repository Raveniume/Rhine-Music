name: RhineMusic desktop release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build Windows runtime package
        if: matrix.os == 'windows-latest'
        run: npm run desktop:build
      - name: Prepare macOS runtime
        if: matrix.os == 'macos-latest'
        run: npm run desktop:prepare
      - name: Generate macOS application icon
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          mkdir -p src-tauri/icons/rhine.iconset
          for size in 16 32 128 256 512; do
            sips -s format png -z "$size" "$size" public/icons/icon-512.png --out "src-tauri/icons/rhine.iconset/icon_${size}x${size}.png" >/dev/null
            if [ "$size" -le 256 ]; then
              double=$((size * 2))
              sips -s format png -z "$double" "$double" public/icons/icon-512.png --out "src-tauri/icons/rhine.iconset/icon_${size}x${size}@2x.png" >/dev/null
            fi
          done
          iconutil -c icns src-tauri/icons/rhine.iconset -o src-tauri/icons/icon.icns
          rm -rf src-tauri/icons/rhine.iconset
          node -e "const fs=require('fs');const p='src-tauri/tauri.conf.json';const c=JSON.parse(fs.readFileSync(p,'utf8'));c.bundle.icon=[...c.bundle.icon,'icons/icon.icns'];fs.writeFileSync(p,JSON.stringify(c,null,2)+'\\n')"
      - name: Build macOS DMG
        if: matrix.os == 'macos-latest'
        run: npx tauri build --bundles dmg -- --locked
      - name: Install NSIS
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          choco install nsis --yes --no-progress
          if (-not (Test-Path 'C:\Program Files (x86)\NSIS\makensis.exe')) { throw 'NSIS compiler was not installed.' }
      - name: Download Microsoft WebView2 bootstrapper
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $bootstrapper = Join-Path $env:RUNNER_TEMP 'MicrosoftEdgeWebView2Setup.exe'
          Invoke-WebRequest -Uri 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $bootstrapper
          $signature = Get-AuthenticodeSignature -LiteralPath $bootstrapper
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation') { throw 'Microsoft WebView2 bootstrapper signature is invalid.' }
          "WEBVIEW_BOOTSTRAPPER=$bootstrapper" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build Windows installer
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: npm run installer:build -- --source release/Rhine-Music-Windows --compiler 'C:\Program Files (x86)\NSIS\makensis.exe' --webview2 "$env:WEBVIEW_BOOTSTRAPPER"
      - name: Hash release asset
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          file=$(find src-tauri/target/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)
          target="release-assets/Rhine-Music-macOS-${version}.dmg"
          mkdir -p release-assets
          cp "$file" "$target"
          sha256sum "$target" > "$target.sha256"
      - name: Copy Windows release asset
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-assets | Out-Null
          Copy-Item release/Installers/Rhine-Music-Windows-*-x64-Setup.exe release-assets/
          Copy-Item release/Installers/Rhine-Music-Windows-*-x64-Setup.exe.sha256 release-assets/
      - uses: actions/upload-artifact@v4
        with:
          name: RhineMusic-${{ matrix.os }}
          path: |
            release-assets/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/**/*
