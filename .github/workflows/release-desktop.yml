name: RhineMusic desktop release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  VITE_PUBLIC_RELEASE: "1"

jobs:
  release-gate:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.gate.outputs.build }}
    steps:
      - id: gate
        name: Do not rebuild a release already promoted from verified artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ "$EVENT" = "push" ] && gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'build=false' >> "$GITHUB_OUTPUT"
          else
            echo 'build=true' >> "$GITHUB_OUTPUT"
          fi
  build:
    needs: release-gate
    if: needs.release-gate.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build Windows runtime package
        if: matrix.os == 'windows-latest'
        run: npm run desktop:build
      - name: Install NSIS
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          choco install nsis --yes --no-progress
          if (-not (Test-Path 'C:\Program Files (x86)\NSIS\makensis.exe')) { throw 'NSIS compiler was not installed.' }
      - name: Download Microsoft WebView2 bootstrapper
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $bootstrapper = Join-Path $env:RUNNER_TEMP 'MicrosoftEdgeWebView2Setup.exe'
          Invoke-WebRequest -Uri 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $bootstrapper
          $signature = Get-AuthenticodeSignature -LiteralPath $bootstrapper
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation') { throw 'Microsoft WebView2 bootstrapper signature is invalid.' }
          "WEBVIEW_BOOTSTRAPPER=$bootstrapper" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build Windows installer
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: npm run installer:build -- --source release/Rhine-Music-Windows --compiler 'C:\Program Files (x86)\NSIS\makensis.exe' --webview2 "$env:WEBVIEW_BOOTSTRAPPER"
      - name: Copy Windows release asset
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-assets | Out-Null
          Copy-Item release/Installers/Rhine-Music-Windows-*-x64-Setup.exe release-assets/
          Copy-Item release/Installers/Rhine-Music-Windows-*-x64-Setup.exe.sha256 release-assets/
      - name: Generate update manifest
        run: node scripts/write-update-manifest.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: RhineMusic-${{ matrix.os }}
          path: |
            release-assets/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Create release without overwriting an existing version
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const version = process.env.TAG.replace(/^v/, '');
          const section = fs.readFileSync('CHANGELOG.md','utf8').split(/^## /m).find(s => s.split(/\r?\n/)[0].includes(`· ${version} ·`));
          if (!section) throw Error('Missing release notes');
          fs.writeFileSync('/tmp/notes.md', '## '+section.trim()+'\n\n本次发布 Windows x64 安装包。macOS 旧包存在打开失败反馈；新版 DMG 暂停自动发布，等待 Mac 签名、公证和实机验收。Mac 接手流程见 [发布规范](https://github.com/Raveniume/Rhine-Music/blob/main/docs/MACOS-RELEASE.md)。\n');
          JS
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --notes-file /tmp/notes.md --title "RhineMusic $TAG"
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" release-assets/*
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
