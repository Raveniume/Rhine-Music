name: RhineMusic Windows compatibility

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  VITE_PUBLIC_RELEASE: "1"

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Select Rust stable
        run: rustup default stable
      - run: npm ci
      - name: Check shared version and platform behavior
        run: npm run check:desktop-platforms
      - name: Build existing Windows package
        run: npm run desktop:build
      - name: Native regression tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Windows package and service checks
        run: npm run check:windows

# Validation only: no tags, release assets, installer promotion, or publishing.
